<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d10">

<title>Механік — Адмінка відгуків</title>

<style>
:root {
  --bg: #0b0d10;
  --panel: #151a20;
  --panel2: #1c2229;
  --text: #f5f7f8;
  --muted: #9da6af;
  --accent: #ff6a00;
  --green: #18c77a;
  --red: #e74c3c;
  --line: #2a3139;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

button,
input {
  font: inherit;
}

.container {
  width: min(1100px, calc(100% - 30px));
  margin: auto;
  padding: 35px 0 70px;
}

/* LOGIN */

.login {
  width: min(440px, 100%);
  margin: 12vh auto 0;
  padding: 28px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: 0 15px 50px rgba(0,0,0,.3);
}

.login h1 {
  margin: 0 0 8px;
  font-size: 34px;
}

.subtitle {
  color: var(--muted);
  margin-bottom: 25px;
}

.input {
  width: 100%;
  padding: 14px 15px;
  margin-bottom: 12px;

  background: #0d1014;
  color: white;

  border: 1px solid var(--line);
  border-radius: 9px;

  outline: none;
}

.input:focus {
  border-color: var(--accent);
}

.login-button {
  width: 100%;
  padding: 14px;

  background: var(--accent);
  color: #111;

  border: 0;
  border-radius: 9px;

  font-weight: 900;
  cursor: pointer;
}

.login-button:disabled {
  opacity: .6;
  cursor: wait;
}

/* MESSAGE */

.message {
  display: none;

  padding: 13px 15px;
  margin-bottom: 18px;

  border-radius: 9px;

  font-weight: 700;
}

.message.success {
  display: block;
  background: rgba(24,199,122,.14);
  color: #63e5aa;
  border: 1px solid rgba(24,199,122,.25);
}

.message.error {
  display: block;
  background: rgba(231,76,60,.14);
  color: #ff8c80;
  border: 1px solid rgba(231,76,60,.25);
}

/* ADMIN */

#admin {
  display: none;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;

  gap: 20px;
  margin-bottom: 25px;
}

.top h1 {
  margin: 0 0 5px;
  font-size: 34px;
}

.top .subtitle {
  margin: 0;
}

.top-buttons {
  display: flex;
  gap: 8px;
}

.button {
  padding: 11px 15px;

  border: 0;
  border-radius: 8px;

  font-weight: 800;
  cursor: pointer;
}

.refresh {
  background: #252d35;
  color: white;
}

.logout {
  background: #20262d;
  color: #ddd;
}

.button:disabled {
  opacity: .55;
  cursor: wait;
}

/* REVIEWS */

.review-list {
  display: grid;
  gap: 15px;
}

.review {
  padding: 22px;

  background: var(--panel);

  border: 1px solid var(--line);
  border-radius: 14px;
}

.review.pending {
  border-left: 4px solid var(--accent);
}

.review.published {
  border-left: 4px solid var(--green);
}

.review-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;

  gap: 15px;
}

.name {
  font-size: 20px;
  font-weight: 900;
}

.date {
  color: var(--muted);
  font-size: 12px;
  text-align: right;
}

.stars {
  margin: 9px 0;

  color: #ffab00;

  font-size: 18px;
  letter-spacing: 2px;
}

.text {
  color: #d7dce1;

  font-size: 16px;
  line-height: 1.6;

  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.status {
  display: inline-block;

  margin-top: 15px;
  padding: 5px 9px;

  border-radius: 6px;

  font-size: 12px;
  font-weight: 900;
}

.status.pending {
  color: var(--accent);
  background: rgba(255,106,0,.14);
}

.status.published {
  color: var(--green);
  background: rgba(24,199,122,.14);
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;

  margin-top: 18px;
}

.publish {
  background: var(--green);
  color: #07150f;
}

.hide {
  background: #303841;
  color: white;
}

.delete {
  background: var(--red);
  color: white;
}

.empty {
  padding: 45px;

  text-align: center;

  color: var(--muted);

  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
}

/* MOBILE */

@media (max-width: 650px) {

  .container {
    width: calc(100% - 20px);
    padding-top: 20px;
  }

  .login {
    margin-top: 8vh;
    padding: 22px;
  }

  .top {
    align-items: flex-start;
    flex-direction: column;
  }

  .top-buttons {
    width: 100%;
  }

  .top-buttons .button {
    flex: 1;
  }

  .review {
    padding: 18px;
  }

  .review-header {
    flex-direction: column;
  }

  .date {
    text-align: left;
  }

  .actions {
    flex-direction: column;
  }

  .actions .button {
    width: 100%;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- =========================
       LOGIN
  ========================== -->

  <section id="login" class="login">

    <h1>МЕХАНІК</h1>

    <div class="subtitle">
      Адмін-панель відгуків
    </div>

    <input
      id="password"
      class="input"
      type="password"
      placeholder="Пароль адміністратора"
      autocomplete="current-password"
      enterkeyhint="go"
    >

    <button
      id="loginButton"
      class="login-button"
      type="button"
    >
      Увійти
    </button>

    <div
      id="loginMessage"
      style="margin-top:15px"
    ></div>

  </section>


  <!-- =========================
       ADMIN
  ========================== -->

  <section id="admin">

    <div class="top">

      <div>
        <h1>Відгуки</h1>

        <div class="subtitle">
          Перевірка та публікація відгуків клієнтів
        </div>
      </div>

      <div class="top-buttons">

        <button
          id="refreshButton"
          class="button refresh"
          type="button"
        >
          🔄 Оновити
        </button>

        <button
          id="logoutButton"
          class="button logout"
          type="button"
        >
          Вийти
        </button>

      </div>

    </div>


    <div
      id="message"
      class="message"
    ></div>


    <div
      id="reviews"
      class="review-list"
    ></div>

  </section>

</div>


<script>
"use strict";


/* =====================================================
   STATE
===================================================== */

let adminPassword = "";

let loading = false;


/* =====================================================
   ELEMENTS
===================================================== */

const loginSection =
  document.getElementById("login");

const adminSection =
  document.getElementById("admin");

const passwordInput =
  document.getElementById("password");

const loginButton =
  document.getElementById("loginButton");

const loginMessage =
  document.getElementById("loginMessage");

const refreshButton =
  document.getElementById("refreshButton");

const logoutButton =
  document.getElementById("logoutButton");

const messageBox =
  document.getElementById("message");

const reviewsContainer =
  document.getElementById("reviews");


/* =====================================================
   MESSAGE
===================================================== */

function showLoginMessage(text, error = true) {

  loginMessage.textContent = text;

  loginMessage.style.display = "block";

  loginMessage.style.padding = "10px 12px";

  loginMessage.style.borderRadius = "8px";

  loginMessage.style.background =
    error
      ? "rgba(231,76,60,.14)"
      : "rgba(24,199,122,.14)";

  loginMessage.style.color =
    error
      ? "#ff8c80"
      : "#63e5aa";
}


function clearLoginMessage() {

  loginMessage.textContent = "";

  loginMessage.style.display = "none";
}


function showMessage(text, error = false) {

  messageBox.textContent = text;

  messageBox.className =
    "message " +
    (error ? "error" : "success");

}


function clearMessage() {

  messageBox.textContent = "";

  messageBox.className = "message";

}


/* =====================================================
   SAFE HTML
===================================================== */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =====================================================
   API REQUEST
===================================================== */

async function adminRequest(
  url,
  options = {}
) {

  const headers = {
    ...(options.headers || {}),
    "x-admin-password": adminPassword
  };


  const response =
    await fetch(url, {
      ...options,
      headers
    });


  let data;

  try {

    data =
      await response.json();

  } catch {

    throw new Error(
      "Сервер повернув некоректну відповідь"
    );

  }


  if (!response.ok) {

    throw new Error(
      data.error ||
      `Помилка сервера: ${response.status}`
    );

  }


  return data;

}


/* =====================================================
   LOGIN
===================================================== */

async function login() {

  if (loading) {
    return;
  }


  const password =
    passwordInput.value.trim();


  if (!password) {

    showLoginMessage(
      "Введіть пароль адміністратора",
      true
    );

    passwordInput.focus();

    return;
  }


  loading = true;

  loginButton.disabled = true;

  loginButton.textContent =
    "Перевірка...";

  clearLoginMessage();


  adminPassword = password;


  try {

    await loadReviews(true);


  } catch (error) {

    adminPassword = "";

    showLoginMessage(
      error.message,
      true
    );

  } finally {

    loading = false;

    loginButton.disabled = false;

    loginButton.textContent =
      "Увійти";

  }

}


/* =====================================================
   LOAD REVIEWS
===================================================== */

async function loadReviews(
  fromLogin = false
) {

  if (!adminPassword) {

    if (fromLogin) {
      throw new Error(
        "Пароль не введено"
      );
    }

    return;

  }


  if (!fromLogin) {

    refreshButton.disabled = true;

    refreshButton.textContent =
      "⏳ Оновлення...";

  }


  try {

    const data =
      await adminRequest(
        "/api/admin/reviews"
      );


    loginSection.style.display =
      "none";

    adminSection.style.display =
      "block";


    renderReviews(
      Array.isArray(data)
        ? data
        : []
    );


    if (!fromLogin) {

      showMessage(
        "Список відгуків оновлено",
        false
      );

    }


  } finally {

    refreshButton.disabled = false;

    refreshButton.textContent =
      "🔄 Оновити";

  }

}


/* =====================================================
   RENDER REVIEWS
===================================================== */

function renderReviews(reviews) {

  if (!reviews.length) {

    reviewsContainer.innerHTML = `
      <div class="empty">
        Відгуків поки немає.
      </div>
    `;

    return;
  }


  reviewsContainer.innerHTML =
    reviews.map(
      review => {

        const id =
          Number(review.id);

        const rating =
          Math.max(
            0,
            Math.min(
              5,
              Number(review.rating) || 0
            )
          );


        const stars =
          "★".repeat(rating) +
          "☆".repeat(5 - rating);


        const approved =
          Number(review.approved) === 1;


        const statusClass =
          approved
            ? "published"
            : "pending";


        const statusText =
          approved
            ? "Опубліковано"
            : "Очікує перевірки";


        const name =
          review.name ||
          "Анонім";


        const date =
          review.created_at ||
          "";


        return `
          <article
            class="review ${statusClass}"
          >

            <div class="review-header">

              <div class="name">
                ${escapeHtml(name)}
              </div>

              <div class="date">
                ${escapeHtml(date)}
              </div>

            </div>


            <div class="stars">
              ${stars}
            </div>


            <div class="text">
              ${escapeHtml(review.text)}
            </div>


            <span
              class="status ${statusClass}"
            >
              ${statusText}
            </span>


            <div class="actions">

              ${
                approved

                ? `
                  <button
                    class="button hide"
                    type="button"
                    data-action="hide"
                    data-id="${id}"
                  >
                    Приховати
                  </button>
                `

                : `
                  <button
                    class="button publish"
                    type="button"
                    data-action="approve"
                    data-id="${id}"
                  >
                    ✓ Опублікувати
                  </button>
                `
              }


              <button
                class="button delete"
                type="button"
                data-action="delete"
                data-id="${id}"
              >
                🗑 Видалити
              </button>

            </div>

          </article>
        `;

      }
    ).join("");

}


/* =====================================================
   REVIEW ACTION
===================================================== */

async function actionReview(
  id,
  action
) {

  if (!adminPassword) {

    showMessage(
      "Сесія завершилась. Увійдіть знову.",
      true
    );

    logout();

    return;
  }


  const buttons =
    reviewsContainer.querySelectorAll(
      `button[data-id="${id}"]`
    );


  buttons.forEach(
    button => {
      button.disabled = true;
    }
  );


  try {

    const data =
      await adminRequest(
        "/api/admin/reviews",
        {
          method: "POST",

          headers: {
            "content-type":
              "application/json"
          },

          body: JSON.stringify({
            id: id,
            action: action
          })
        }
      );


    showMessage(
      data.message ||
      "Готово",
      false
    );


    await loadReviews();


  } catch (error) {

    showMessage(
      error.message,
      true
    );


    buttons.forEach(
      button => {
        button.disabled = false;
      }
    );

  }

}


/* =====================================================
   DELETE
===================================================== */

async function deleteReview(id) {

  const confirmed =
    window.confirm(
      "Видалити цей відгук назавжди?"
    );


  if (!confirmed) {
    return;
  }


  await actionReview(
    id,
    "delete"
  );

}


/* =====================================================
   CLICK HANDLER
===================================================== */

reviewsContainer.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        "button[data-action]"
      );


    if (!button) {
      return;
    }


    const id =
      Number(button.dataset.id);


    const action =
      button.dataset.action;


    if (!Number.isInteger(id)) {
      return;
    }


    if (action === "delete") {

      deleteReview(id);

      return;
    }


    actionReview(
      id,
      action
    );

  }
);


/* =====================================================
   LOGOUT
===================================================== */

function logout() {

  adminPassword = "";

  loading = false;

  adminSection.style.display =
    "none";

  loginSection.style.display =
    "block";

  passwordInput.value = "";

  clearMessage();

  clearLoginMessage();

  passwordInput.focus();

}


/* =====================================================
   BUTTONS
===================================================== */

loginButton.addEventListener(
  "click",
  login
);


refreshButton.addEventListener(
  "click",
  () => loadReviews()
);


logoutButton.addEventListener(
  "click",
  logout
);


/* =====================================================
   ENTER KEY
===================================================== */

passwordInput.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {

      event.preventDefault();

      login();

    }

  }
);

</script>

</body>
</html>
