<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Механік — Адмін-панель</title>
<style>
:root{--bg:#0b0d10;--panel:#151a20;--text:#f5f7f8;--muted:#9da6af;--accent:#ff6a00;--green:#18c77a;--red:#e74c3c;--blue:#4aa3ff;--line:#2a3139}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.wrap{width:min(1100px,calc(100% - 24px));margin:auto;padding:25px 0 60px}button,input{font:inherit}.login,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}.login{max-width:430px;margin:10vh auto}.input{width:100%;padding:14px;margin:8px 0;background:#0d1014;color:#fff;border:1px solid var(--line);border-radius:8px}.btn{padding:11px 15px;border:0;border-radius:8px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#111}.green{background:var(--green);color:#07150f}.gray{background:#303841;color:#fff}.red{background:var(--red);color:#fff}.blue{background:var(--blue);color:#06111c}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}.tab{background:#20262d;color:#ddd}.tab.active{background:var(--accent);color:#111}.list{display:grid;gap:12px}.muted{color:var(--muted)}.title{font-size:20px;font-weight:900}.meta{font-size:13px;color:var(--muted);margin:6px 0}.text{line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:8px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px}.status{display:inline-block;padding:5px 8px;border-radius:6px;font-size:12px;font-weight:900;margin-top:8px}.new{background:#ff6a0022;color:#ff6a00}.confirmed{background:#18c77a22;color:#18c77a}.completed{background:#4aa3ff22;color:#75bbff}.cancelled{background:#e74c3c22;color:#ff8d80}.history{border-left:3px solid #65717d}.empty{text-align:center;padding:35px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:12px}.error{color:#ff8d80;background:#e74c3c18;padding:10px;border-radius:8px;margin-top:10px}.success{color:#65e5a9;background:#18c77a18;padding:10px;border-radius:8px;margin-top:10px}.hint{font-size:13px;color:var(--muted);margin:8px 0 18px}
@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}.tabs{width:100%}.tab{flex:1;min-width:120px}.actions{flex-direction:column}.actions .btn,.actions a{width:100%;text-align:center}}
</style>
</head>
<body><div class="wrap">
<section id="login" class="login"><h1>МЕХАНІК</h1><p class="muted">Адмін-панель</p><input id="password" class="input" type="password" placeholder="Пароль адміністратора"><button id="loginBtn" class="btn primary" style="width:100%">Увійти</button><div id="loginMsg"></div></section>
<section id="admin" style="display:none">
<div class="top"><div><h1>МЕХАНІК</h1><div class="muted">Керування сайтом</div></div><div><button id="refresh" class="btn gray">🔄 Оновити</button> <button id="logout" class="btn gray">Вийти</button></div></div>
<div class="tabs"><button class="btn tab active" data-tab="bookings">📅 Заявки</button><button class="btn tab" data-tab="history">🗂 Історія</button><button class="btn tab" data-tab="reviews">⭐ Відгуки</button></div>
<div id="message"></div><div id="content"></div>
</section></div>
<script>
let password="",currentTab="bookings";
const $=id=>document.getElementById(id);
function msg(text,error=false){$("message").className=error?"error":"success";$("message").textContent=text}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
const statusName={new:"Нова",confirmed:"Підтверджена",completed:"Виконана",cancelled:"Скасована"};
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),"x-admin-password":password}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||`Помилка ${r.status}`);return d}
async function login(){password=$("password").value.trim();if(!password){$("loginMsg").textContent="Введіть пароль";return}$("loginBtn").disabled=true;try{await loadBookings();$("login").style.display="none";$("admin").style.display="block"}catch(e){password="";$("loginMsg").textContent=e.message}finally{$("loginBtn").disabled=false}}
async function loadBookings(){renderBookings(await api("/api/admin/bookings"))}
async function loadHistory(){renderHistory(await api("/api/admin/history"))}
async function loadReviews(){renderReviews(await api("/api/admin/reviews"))}
function renderBookings(a){$("content").innerHTML=a.length?a.map(b=>`<article class="card"><div class="title">#${b.id} · ${esc(b.name)}</div><div class="meta">📞 ${esc(b.phone)} · 🚗 ${esc(b.car)}</div><div class="meta">🔧 ${esc(b.service)} · 📅 ${esc(b.preferred_date)} · ⏰ ${esc(b.preferred_time)}</div>${b.comment?`<div class="text">📝 ${esc(b.comment)}</div>`:""}<span class="status ${esc(b.status)}">${statusName[b.status]||esc(b.status)}</span><div class="actions">${b.status==="new"?`<button class="btn green" onclick="bookingAction(${b.id},'confirm')">✓ Підтвердити</button>`:""}${b.status==="confirmed"?`<button class="btn green" onclick="bookingAction(${b.id},'complete')">✓ Виконано</button>`:""}${b.status!=="cancelled"?`<button class="btn gray" onclick="bookingAction(${b.id},'cancel')">Скасувати</button>`:`<button class="btn gray" onclick="bookingAction(${b.id},'reopen')">Повернути</button>`}<a class="btn primary" href="tel:${esc(b.phone)}">📞 Подзвонити</a><button class="btn red" onclick="bookingAction(${b.id},'delete')">🗑 В архів</button></div></article>`).join(""):`<div class="empty">Активних заявок немає.</div>`}
function renderHistory(a){$("content").innerHTML=`<div class="hint">Тут зберігаються заявки, які прибрали з активного списку. Вони не видаляються з бази.</div>`+(a.length?a.map(b=>`<article class="card history"><div class="title">#${b.id} · ${esc(b.name)}</div><div class="meta">📞 ${esc(b.phone)} · 🚗 ${esc(b.car)}</div><div class="meta">🔧 ${esc(b.service)} · 📅 ${esc(b.preferred_date)} · ⏰ ${esc(b.preferred_time)}</div>${b.comment?`<div class="text">📝 ${esc(b.comment)}</div>`:""}<span class="status ${esc(b.status)}">${statusName[b.status]||esc(b.status)}</span><div class="meta">Архівовано: ${esc(b.archived_at||"")}</div></article>`).join(""):`<div class="empty">Історія поки порожня.</div>`}
function renderReviews(a){$("content").innerHTML=a.length?a.map(r=>`<article class="card"><div class="title">${esc(r.name||"Анонім")}</div><div style="color:#ffab00;margin:7px 0">${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)}</div><div class="text">${esc(r.text)}</div><div class="meta">${esc(r.created_at||"")}</div><span class="status ${Number(r.approved)===1?"confirmed":"new"}">${Number(r.approved)===1?"Опубліковано":"Очікує перевірки"}</span><div class="actions">${Number(r.approved)===1?`<button class="btn gray" onclick="reviewAction(${r.id},'hide')">Приховати</button>`:`<button class="btn green" onclick="reviewAction(${r.id},'approve')">✓ Опублікувати</button>`}<button class="btn red" onclick="reviewAction(${r.id},'delete')">🗑 Видалити</button></div></article>`).join(""):`<div class="empty">Відгуків поки немає.</div>`}
async function bookingAction(id,action){if(action==="delete"&&!confirm("Перемістити заявку в історію та видалити її повідомлення з Telegram?"))return;try{const d=await api("/api/admin/bookings",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id,action})});msg(d.warning||d.message);await loadBookings()}catch(e){msg(e.message,true)}}
async function reviewAction(id,action){if(action==="delete"&&!confirm("Видалити відгук назавжди?"))return;try{msg((await api("/api/admin/reviews",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id,action})})).message);await loadReviews()}catch(e){msg(e.message,true)}}
async function selectTab(tab){currentTab=tab;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===tab));try{if(tab==="bookings")await loadBookings();else if(tab==="history")await loadHistory();else await loadReviews()}catch(e){msg(e.message,true)}}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>selectTab(b.dataset.tab));
$("loginBtn").onclick=login;$("password").onkeydown=e=>{if(e.key==="Enter")login()};$("refresh").onclick=()=>selectTab(currentTab);$("logout").onclick=()=>{password="";$("admin").style.display="none";$("login").style.display="block";$("password").value=""};
</script></body></html>
