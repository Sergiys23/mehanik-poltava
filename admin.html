<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Механік — Адмін-панель</title>

<style>
:root{
  --bg:#0b0d10;
  --panel:#151a20;
  --panel2:#101419;
  --text:#f5f7f8;
  --muted:#9da6af;
  --accent:#ff6a00;
  --green:#18c77a;
  --red:#e74c3c;
  --blue:#4aa3ff;
  --line:#2a3139;
  --yellow:#ffb000;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
}

button,
input{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.wrap{
  width:min(1100px,calc(100% - 24px));
  margin:auto;
  padding:24px 0 60px;
}

/* LOGIN */

.login{
  max-width:430px;
  margin:10vh auto 0;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:28px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.logo{
  font-size:38px;
  font-weight:900;
  margin-bottom:5px;
}

.subtitle{
  color:var(--muted);
  margin-bottom:25px;
}

.input{
  width:100%;
  padding:16px;
  margin:8px 0;
  background:#0d1014;
  color:#fff;
  border:1px solid var(--line);
  border-radius:10px;
  outline:none;
}

.input:focus{
  border-color:var(--accent);
}

.btn{
  border:0;
  border-radius:10px;
  padding:13px 16px;
  font-weight:800;
  cursor:pointer;
  transition:.15s;
}

.btn:active{
  transform:scale(.98);
}

.btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.primary{
  background:var(--accent);
  color:#111;
}

.green{
  background:var(--green);
  color:#07150f;
}

.gray{
  background:#303841;
  color:#fff;
}

.red{
  background:var(--red);
  color:#fff;
}

.blue{
  background:var(--blue);
  color:#06111c;
}

.message{
  margin-top:12px;
  padding:12px;
  border-radius:10px;
  line-height:1.45;
}

.error{
  color:#ffaaa0;
  background:#e74c3c18;
  border:1px solid #e74c3c35;
}

.success{
  color:#65e5a9;
  background:#18c77a18;
  border:1px solid #18c77a35;
}

.info{
  color:#9ed1ff;
  background:#4aa3ff18;
  border:1px solid #4aa3ff35;
}

/* ADMIN */

#admin{
  display:none;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.top h1{
  margin:0;
  font-size:30px;
}

.top-sub{
  color:var(--muted);
  margin-top:5px;
}

.top-actions{
  display:flex;
  gap:8px;
}

/* TABS */

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:18px;
  flex-wrap:wrap;
}

.tab{
  background:#20262d;
  color:#ddd;
}

.tab.active{
  background:var(--accent);
  color:#111;
}

/* CARDS */

.list{
  display:grid;
  gap:12px;
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:15px;
  padding:18px;
}

.title{
  font-size:20px;
  font-weight:900;
}

.meta{
  font-size:14px;
  color:var(--muted);
  margin-top:7px;
  line-height:1.45;
}

.text{
  margin-top:10px;
  line-height:1.55;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.status{
  display:inline-block;
  padding:6px 9px;
  border-radius:7px;
  font-size:12px;
  font-weight:900;
  margin-top:12px;
}

.status-new{
  background:#ff6a0022;
  color:#ff7a18;
}

.status-confirmed{
  background:#18c77a22;
  color:#18c77a;
}

.status-completed{
  background:#4aa3ff22;
  color:#75bbff;
}

.status-cancelled{
  background:#e74c3c22;
  color:#ff8d80;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:15px;
}

.history{
  border-left:4px solid #65717d;
}

.empty{
  text-align:center;
  padding:40px 20px;
  color:var(--muted);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:15px;
}

.hint{
  color:var(--muted);
  font-size:14px;
  margin-bottom:15px;
  line-height:1.5;
}

.loading{
  text-align:center;
  padding:40px;
  color:var(--muted);
}

/* MOBILE */

@media(max-width:650px){

  .wrap{
    width:calc(100% - 16px);
    padding-top:15px;
  }

  .login{
    margin-top:5vh;
    padding:22px;
  }

  .logo{
    font-size:32px;
  }

  .top{
    align-items:flex-start;
    flex-direction:column;
  }

  .top-actions{
    width:100%;
  }

  .top-actions .btn{
    flex:1;
  }

  .tabs{
    width:100%;
  }

  .tab{
    flex:1;
    min-width:0;
  }

  .actions{
    flex-direction:column;
  }

  .actions .btn,
  .actions a{
    width:100%;
    text-align:center;
  }

  .card{
    padding:15px;
  }

  .title{
    font-size:18px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <!-- LOGIN -->

  <section id="login" class="login">

    <div class="logo">МЕХАНІК</div>
    <div class="subtitle">Адмін-панель</div>

    <input
      id="password"
      class="input"
      type="password"
      autocomplete="current-password"
      placeholder="Пароль адміністратора"
    >

    <button
      id="loginBtn"
      class="btn primary"
      style="width:100%;margin-top:8px"
    >
      Увійти
    </button>

    <div id="loginMsg"></div>

  </section>


  <!-- ADMIN -->

  <section id="admin">

    <div class="top">

      <div>
        <h1>МЕХАНІК</h1>
        <div class="top-sub">
          Керування заявками та сайтом
        </div>
      </div>

      <div class="top-actions">

        <button
          id="refresh"
          class="btn gray"
        >
          🔄 Оновити
        </button>

        <button
          id="logout"
          class="btn gray"
        >
          Вийти
        </button>

      </div>

    </div>


    <div class="tabs">

      <button
        class="btn tab active"
        data-tab="bookings"
      >
        📅 Заявки
      </button>

      <button
        class="btn tab"
        data-tab="history"
      >
        🗂 Історія
      </button>

      <button
        class="btn tab"
        data-tab="reviews"
      >
        ⭐ Відгуки
      </button>

    </div>


    <div id="message"></div>

    <div id="content"></div>

  </section>

</div>


<script>

"use strict";


/* =========================
   STATE
========================= */

let adminPassword = "";
let currentTab = "bookings";


/* =========================
   HELPERS
========================= */

function $(id){
  return document.getElementById(id);
}


function showMessage(text,type="success"){

  const box = $("message");

  box.className = "message " + type;

  box.textContent = text;

}


function showLoginMessage(text,type="error"){

  const box = $("loginMsg");

  box.className = "message " + type;

  box.textContent = text;

}


function clearMessages(){

  $("message").className = "";

  $("message").textContent = "";

}


function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function statusText(status){

  const names = {
    new:"Нова",
    confirmed:"Підтверджена",
    completed:"Виконана",
    cancelled:"Скасована"
  };

  return names[status] || status || "Невідомо";

}


function statusClass(status){

  return "status-" + String(status || "")
    .replace(/[^a-z0-9_-]/gi,"");

}


function renderLoading(){

  $("content").innerHTML =
    '<div class="loading">⏳ Завантаження...</div>';

}


/* =========================
   API
========================= */

async function api(url,options={}){

  const headers = {
    ...(options.headers || {}),
    "x-admin-password": adminPassword,
    "cache-control":"no-cache"
  };


  const response = await fetch(url,{
    ...options,
    headers,
    cache:"no-store"
  });


  let data = null;

  try{

    data = await response.json();

  }catch{

    data = {};

  }


  if(!response.ok){

    throw new Error(
      data?.error ||
      `HTTP ${response.status}`
    );

  }


  return data;

}


/* =========================
   LOGIN
========================= */

async function login(){

  const password =
    $("password").value.trim();


  if(!password){

    showLoginMessage(
      "Введіть пароль адміністратора."
    );

    return;

  }


  $("loginBtn").disabled = true;

  $("loginBtn").textContent =
    "⏳ Перевірка...";


  try{

    adminPassword = password;


    /*
      Перевіряємо реальний API.
      Якщо тут помилка, адмінка НЕ відкривається.
    */

    const data =
      await api("/api/admin/bookings");


    if(!Array.isArray(data)){

      throw new Error(
        "Worker повернув некоректну відповідь."
      );

    }


    $("login").style.display = "none";

    $("admin").style.display = "block";


    clearMessages();

    renderBookings(data);


  }catch(error){

    adminPassword = "";

    showLoginMessage(
      "Помилка входу: " + error.message,
      "error"
    );

  }finally{

    $("loginBtn").disabled = false;

    $("loginBtn").textContent = "Увійти";

  }

}


/* =========================
   BOOKINGS
========================= */

async function loadBookings(){

  renderLoading();

  const data =
    await api("/api/admin/bookings");

  renderBookings(data);

}


function renderBookings(bookings){

  if(!Array.isArray(bookings)){

    throw new Error(
      "Некоректні дані заявок."
    );

  }


  if(bookings.length === 0){

    $("content").innerHTML =
      '<div class="empty">📭 Активних заявок немає.</div>';

    return;

  }


  $("content").innerHTML =
    '<div class="list">' +

    bookings.map(booking => {

      const id = Number(booking.id);


      return `
        <article class="card">

          <div class="title">
            🆔 #${esc(booking.id)}
            · ${esc(booking.name)}
          </div>

          <div class="meta">
            📞 ${esc(booking.phone)}
          </div>

          <div class="meta">
            🚗 ${esc(booking.car)}
          </div>

          <div class="meta">
            🔧 ${esc(booking.service)}
          </div>

          <div class="meta">
            📅 ${esc(booking.preferred_date)}
            · ⏰ ${esc(booking.preferred_time)}
          </div>

          ${
            booking.comment
              ? `<div class="text">
                   📝 ${esc(booking.comment)}
                 </div>`
              : ""
          }

          <span class="status ${statusClass(booking.status)}">
            ${esc(statusText(booking.status))}
          </span>

          <div class="actions">

            ${
              booking.status === "new"
              ?
              `
              <button
                class="btn green"
                onclick="bookingAction(${id},'confirm')"
              >
                ✓ Підтвердити
              </button>
              `
              :
              ""
            }


            ${
              booking.status === "confirmed"
              ?
              `
              <button
                class="btn green"
                onclick="bookingAction(${id},'complete')"
              >
                ✔ Виконано
              </button>
              `
              :
              ""
            }


            ${
              booking.status !== "cancelled"
              ?
              `
              <button
                class="btn gray"
                onclick="bookingAction(${id},'cancel')"
              >
                🚫 Скасувати
              </button>
              `
              :
              `
              <button
                class="btn gray"
                onclick="bookingAction(${id},'reopen')"
              >
                ↩ Повернути
              </button>
              `
            }


            <a
              class="btn primary"
              href="tel:${esc(booking.phone)}"
            >
              📞 Подзвонити
            </a>


            <button
              class="btn red"
              onclick="bookingAction(${id},'delete')"
            >
              🗑 В архів
            </button>

          </div>

        </article>
      `;

    }).join("") +

    "</div>";

}


/* =========================
   BOOKING ACTION
========================= */

async function bookingAction(id,action){

  if(!Number.isInteger(Number(id))){

    showMessage(
      "Невірний ID заявки.",
      "error"
    );

    return;

  }


  if(action === "delete"){

    const ok = confirm(
      "Перемістити заявку в історію?\n\n" +
      "Заявка залишиться в базі, " +
      "а її повідомлення буде видалено з Telegram."
    );


    if(!ok){

      return;

    }

  }


  try{

    showMessage(
      "⏳ Виконується...",
      "info"
    );


    const data =
      await api(
        "/api/admin/bookings",
        {
          method:"POST",

          headers:{
            "content-type":
              "application/json"
          },

          body:JSON.stringify({
            id:Number(id),
            action:String(action)
          })
        }
      );


    showMessage(
      data.warning ||
      data.message ||
      "Операцію виконано."
    );


    await loadBookings();


  }catch(error){

    showMessage(
      error.message,
      "error"
    );

  }

}


/* =========================
   HISTORY
========================= */

async function loadHistory(){

  renderLoading();

  const data =
    await api("/api/admin/history");

  renderHistory(data);

}


function renderHistory(history){

  if(!Array.isArray(history)){

    throw new Error(
      "Некоректні дані історії."
    );

  }


  let html = `
    <div class="hint">
      🗂 Тут знаходяться заявки, які були
      прибрані з активного списку.
      Вони не видаляються з бази.
    </div>
  `;


  if(history.length === 0){

    html +=
      '<div class="empty">Історія поки порожня.</div>';

    $("content").innerHTML = html;

    return;

  }


  html += '<div class="list">';


  html += history.map(booking => `

    <article class="card history">

      <div class="title">
        🆔 #${esc(booking.id)}
        · ${esc(booking.name)}
      </div>

      <div class="meta">
        📞 ${esc(booking.phone)}
      </div>

      <div class="meta">
        🚗 ${esc(booking.car)}
      </div>

      <div class="meta">
        🔧 ${esc(booking.service)}
      </div>

      <div class="meta">
        📅 ${esc(booking.preferred_date)}
        · ⏰ ${esc(booking.preferred_time)}
      </div>

      ${
        booking.comment
        ?
        `<div class="text">
           📝 ${esc(booking.comment)}
         </div>`
        :
        ""
      }

      <span class="status ${statusClass(booking.status)}">
        ${esc(statusText(booking.status))}
      </span>

      <div class="meta">
        🗂 Архівовано:
        ${esc(booking.archived_at || "")}
      </div>

    </article>

  `).join("");


  html += "</div>";

  $("content").innerHTML = html;

}


/* =========================
   REVIEWS
========================= */

async function loadReviews(){

  renderLoading();

  const data =
    await api("/api/admin/reviews");

  renderReviews(data);

}


function renderReviews(reviews){

  if(!Array.isArray(reviews)){

    throw new Error(
      "Некоректні дані відгуків."
    );

  }


  if(reviews.length === 0){

    $("content").innerHTML =
      '<div class="empty">⭐ Відгуків поки немає.</div>';

    return;

  }


  $("content").innerHTML =
    '<div class="list">' +

    reviews.map(review => {

      const rating =
        Math.max(
          0,
          Math.min(
            5,
            Number(review.rating) || 0
          )
        );


      const approved =
        Number(review.approved) === 1;


      return `

        <article class="card">

          <div class="title">
            ${esc(review.name || "Анонім")}
          </div>

          <div style="margin-top:8px;font-size:20px">
            ${"★".repeat(rating)}
            ${"☆".repeat(5-rating)}
          </div>

          <div class="text">
            ${esc(review.text)}
          </div>

          <div class="meta">
            ${esc(review.created_at || "")}
          </div>

          <span class="status ${
            approved
              ? "status-confirmed"
              : "status-new"
          }">
            ${
              approved
                ? "Опубліковано"
                : "Очікує перевірки"
            }
          </span>

          <div class="actions">

            ${
              approved
              ?
              `
              <button
                class="btn gray"
                onclick="reviewAction(${Number(review.id)},'hide')"
              >
                👁 Приховати
              </button>
              `
              :
              `
              <button
                class="btn green"
                onclick="reviewAction(${Number(review.id)},'approve')"
              >
                ✓ Опублікувати
              </button>
              `
            }


            <button
              class="btn red"
              onclick="reviewAction(${Number(review.id)},'delete')"
            >
              🗑 Видалити
            </button>

          </div>

        </article>

      `;

    }).join("") +

    "</div>";

}


/* =========================
   REVIEW ACTION
========================= */

async function reviewAction(id,action){

  if(action === "delete"){

    if(!confirm(
      "Видалити відгук назавжди?"
    )){

      return;

    }

  }


  try{

    showMessage(
      "⏳ Виконується...",
      "info"
    );


    const data =
      await api(
        "/api/admin/reviews",
        {
          method:"POST",

          headers:{
            "content-type":
              "application/json"
          },

          body:JSON.stringify({
            id:Number(id),
            action:String(action)
          })
        }
      );


    showMessage(
      data.message ||
      "Операцію виконано."
    );


    await loadReviews();


  }catch(error){

    showMessage(
      error.message,
      "error"
    );

  }

}


/* =========================
   TABS
========================= */

async function selectTab(tab){

  currentTab = tab;


  document
    .querySelectorAll(".tab")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.tab === tab
      );

    });


  clearMessages();


  try{

    if(tab === "bookings"){

      await loadBookings();

    }else if(tab === "history"){

      await loadHistory();

    }else if(tab === "reviews"){

      await loadReviews();

    }

  }catch(error){

    showMessage(
      error.message,
      "error"
    );

  }

}


/* =========================
   LOGOUT
========================= */

function logout(){

  adminPassword = "";

  currentTab = "bookings";

  $("admin").style.display = "none";

  $("login").style.display = "block";

  $("password").value = "";

  $("content").innerHTML = "";

  clearMessages();

  showLoginMessage(
    "Ви вийшли з адмін-панелі.",
    "info"
  );

}


/* =========================
   EVENTS
========================= */

$("loginBtn").addEventListener(
  "click",
  login
);


$("password").addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){

      login();

    }

  }
);


$("refresh").addEventListener(
  "click",
  () => selectTab(currentTab)
);


$("logout").addEventListener(
  "click",
  logout
);


document
  .querySelectorAll(".tab")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => selectTab(button.dataset.tab)
    );

  });


/* =========================
   START
========================= */

$("password").focus();

</script>

</body>
  </html>
