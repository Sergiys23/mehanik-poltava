<!doctype html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Механік — Адмін</title><link rel="stylesheet" href="/style.css"></head><body><header class="header"><a class="logo-wrap" href="/"><img class="site-logo" src="/images/logo.svg" alt=""><span class="logo-text"><b>МЕХАНІК</b><span>АДМІН</span></span></a><a href="/">← На сайт</a></header><main class="admin-wrap"><section id="login" class="form login-box"><h2>🔐 Вхід адміністратора</h2><input id="loginUser" placeholder="Логін" autocomplete="username"><input id="loginPass" type="password" placeholder="Пароль" autocomplete="current-password"><button id="loginBtn" class="btn primary">Увійти</button><p id="loginMsg"></p></section><section id="panel" class="hidden"><div class="admin-top"><div><p class="eyebrow">ПАНЕЛЬ КЕРУВАННЯ</p><h1>Механік Полтава</h1><div>Роль: <b id="role"></b></div></div><div><button id="refresh" class="btn secondary">🔄 Оновити</button><button id="logout" class="btn secondary">Вийти</button></div></div><nav class="admin-tabs"><button class="btn active" data-tab="bookings">📅 Заявки</button><button class="btn" data-tab="history">🗂 Архів</button><button class="btn" data-tab="reviews">⭐ Відгуки</button><button class="btn" data-tab="works">🔧 Роботи</button><button class="btn" data-tab="logs">📋 Журнал</button><button class="btn" data-tab="blocks">⛔ Блокування</button></nav><div id="msg"></div><div id="content"></div></section></main><script src="/admin.js"></script></body></html>
